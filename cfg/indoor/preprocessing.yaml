preprocessing_node:
  ros__parameters:
    # -----------------------------------------------------------------------
    # Topics
    # -----------------------------------------------------------------------
    lidar_topic: /velodyne_points
    odom_topic: /odometry/filtered

    # -----------------------------------------------------------------------
    # Frames
    # -----------------------------------------------------------------------
    lidar_frame: velodyne          # TF frame of the LiDAR
    base_frame: base_link          # rigid base->lidar TF is looked up once and cached
    global_frame: odom             # frame the processed LiDAR cloud is published in

    # calibration_enabled: unset here on purpose — run_detector.launch.py's
    # own enable_calibration arg (default false) forwards it, single source
    # of truth shared with whether calibration_icp_node even gets launched
    # and with static_structures_node's own copy of this same flag. false =
    # every camera's depth crop trusts the robot's raw URDF/bag TF chain
    # permanently instead of ever looking for a <name>_refined ICP TF — see
    # preprocessing_node.cpp's own calibration_enabled_ comment. Only
    # matters when running preprocessing_node standalone; set it there if so.

    # -----------------------------------------------------------------------
    # Cameras — an arbitrary list, not just one. Each name below gets its
    # own parameter sub-tree (<name>.depth_topic, <name>.aligned_depth_topic,
    # <name>.refined_camera_frame, ...); any key left unset for a camera
    # falls back to preprocessing_node.cpp's own default, which is already
    # built from that camera's name (e.g. /<name>/camera/depth/image_rect_raw,
    # <name>_refined) — this robot's front_camera and back_camera both
    # publish under that exact topic-naming convention, so only the actual
    # per-bag override (aligned_depth_transport — this bag only has aligned
    # depth as zstd, not the compressedDepth the live camera would use)
    # needs setting explicitly for either one. See preprocessing_node.cpp's
    # file header. static_structures_node (see cfg/indoor/static_structures.yaml)
    # must be given this SAME list at launch — see run_detector.launch.py.
    #
    # <name>.aligned_depth_cloud_topic: if set, skip decoding+deprojecting
    # aligned_depth_topic entirely and read an already-deprojected
    # PointCloud2 straight from that topic instead — e.g. RealSense's own
    # "pointcloud" filter output, "<name>/camera/depth/color/points"
    # (present in bags/*_validation_lab). Arrives in <name>_depth_optical_frame,
    # not _color_optical_frame like the deprojected path. The calibrated
    # lidar<->camera TF (calibration_icp_node) is STILL what places this
    # cloud in global_frame_: finishDepthCloud()/computeGlobalDepthTransform()
    # compose T_lidar_camera (calibrated, color-optical convention) with the
    # inverse of the RealSense depth<->color extrinsic first, and
    # calibration_icp_node/static_structures_node do the same for their own
    # copy of this cloud — all three forwarded from THIS key by
    # run_detector.launch.py, so they can't disagree.
    #
    # Native cloud is the geometry source here: measured ~22% of one core in
    # preprocessing_node vs ~78% for deprojecting the aligned image
    # (single-threaded node, the bottleneck of the geometry chain), with the
    # same ~30 Hz output and equivalent alignment to the LiDAR. It is not an
    # organized cloud (height=1, is_dense, already filtered by the driver),
    # so semantic ground points project each point onto the segmentation
    # mask instead of indexing it by pixel — see ground_mask_topic in
    # preprocessing_node.cpp's header.
    # cfg/outdoor/preprocessing.yaml keeps the image path (its own choice,
    # same key, different value — indoor/outdoor differ by VALUES only).
    # -----------------------------------------------------------------------
    camera_names: ["front_camera", "back_camera"]
    front_camera:
      aligned_depth_transport: zstd
      aligned_depth_cloud_topic: /front_camera/camera/depth/color/points
    back_camera:
      aligned_depth_transport: zstd
      aligned_depth_cloud_topic: /back_camera/camera/depth/color/points

    depth_scale_factor: 1000.0     # raw_value / scale = meters (1000 for Intel RealSense 16-bit), same for every camera
    depth_min_value: 0.5           # [m] points closer than this are discarded
    depth_max_value: 5.0           # [m] points farther than this are discarded
    depth_skip_pixel: 2            # subsample every N pixels to reduce computation

    # Depth-side counterpart of lidar_processed_voxel_size/downsample_threshold
    # above — but a different mechanism (density gate + centroid, not
    # adaptive voxel grid). Same parameter names/values as onboard_detector's
    # dynamicDetector::voxelFilter (voxel_size/voxel_occupied_thresh there,
    # identical indoor/outdoor there too), but not quite the same rule: a
    # voxel with fewer than the threshold's worth of points still contributes
    # nothing, but a qualifying voxel emits the CENTROID of all its points,
    # not one arbitrary raw one — see occupancyVoxelFilter()'s own comment.
    depth_processed_voxel_size: 0.05            # [m] voxel size for the density gate
    depth_processed_voxel_occupied_thresh: 3.0 # points a voxel needs before it contributes one point to the output
    # Range-dependent occupancy gate: the two keys above are the NEAR band (camera range < depth_processed_split_range);
    # the native cloud is decimated, so points get sparser with distance and the far band uses a larger voxel
    # (and usually a lower threshold) so distant voxels can still gather enough points.
    depth_processed_voxel_size_far: 0.1            # [m] voxel size beyond the split range
    depth_processed_voxel_occupied_thresh_far: 2.0  # points a far voxel needs
    depth_processed_split_range: 2.0               # [m] camera-frame distance separating the bands

    # true: native depth clouds are processed only for the frame closest to each LiDAR scan (scan_trigger),
    # not for every camera frame — the detection tick is the scan, the other frames would never be used.
    depth_process_on_scan_trigger: true
    # YOLO 2D detections -> 3D semantic leaves (topic /onboard_detector_v2/<camera>/semantic_leaves): the depth points inside each
    # detection's box, foreground only, with the detection's track id per point. The detections topic per camera is forwarded from
    # semantic_segmentation.yaml by run_detector.launch.py.
    #
    # yolo_leaf_method: unset here on purpose, same reasoning as calibration_enabled above — run_detector.launch.py's
    # own yolo_leaf_method arg (default "box") forwards it, single source of truth shared with which topics get
    # wired into yolo_detections_topic/yolo_mask_topic below. "box" = the box-crop + mode/valley extraction this
    # file's own yolo_leaf_* params below tune; "mask" = yolo_seg_track_node's own per-pixel instance masks
    # instead — pixel-exact object membership in image space, but STILL goes through the same depth mode/valley
    # window below (a silhouette edge can have a background point reproject into the mask's own footprint from
    # depth<->color parallax alone; the mask method only skips the box/inflate heuristics, not the depth one) —
    # see preprocessing_node.cpp's own depthModeValleyWindow()/yolo_leaf_method_ comments and the launch arg's
    # own description.
    yolo_leaf_box_inflate: 0.05        # each 2D box side grows by this fraction (the YOLO frame is a few tens of ms older than the depth frame) — only used by yolo_leaf_method=="box"
    yolo_leaf_min_points: 10           # a leaf needs at least this many depth points
    yolo_leaf_depth_tolerance: 0.5     # [m] ABSOLUTE SAFETY CAP on the valley-bounded window below (not the primary boundary — see depthModeValleyWindow's own comment on why mode+valley, not nearest-depth or a fixed +/- window) — used by both yolo_leaf_method values
    yolo_leaf_depth_bin: 0.3           # [m] depth-histogram bin width used to find the dominant depth cluster (mode) — used by both yolo_leaf_method values
    yolo_leaf_valley_fraction: 0.15    # the depth window expands from the mode bin until density drops below this fraction of the peak — i.e. stops at the real gap between the object and whatever's adjacent to it in depth — used by both yolo_leaf_method values
    yolo_class_names_path: cfg/coco.names   # same class list the YOLO detection nodes use, loaded to turn each leaf's class STRING into a small numeric index for the leaves cloud (see publishSemanticLeaves)
    yolo_leaf_max_age: 0.3             # [s] ignore detections older than this
    depth_trigger_max_wait_sec: 0.15   # give up on a scan if no camera frame reaches it within this

    # -----------------------------------------------------------------------
    # LiDAR — sensor-frame filtering (applied before the global transform,
    # to the general-purpose cloud only — see preprocessing_node.cpp's file
    # header. The voxelized_sensor cloud static_structures_node reads from is
    # NOT range-cropped here at all; that node does its own, via
    # cfg/indoor/static_structures.yaml's own lidar_range_x/y).
    # -----------------------------------------------------------------------
    lidar_range_x: 15.0             # [m] ±X around the sensor
    lidar_range_y: 15.0             # [m] ±Y around the sensor
    # LiDAR general-purpose cloud thinning: deterministic voxel centroids (mean of the raw points in each
    # voxel, no minimum count) in two range bands — coarser near the robot where the scan is very dense,
    # finer beyond lidar_voxel_split_range where points are already sparser than the leaf.
    lidar_voxel_near: 0.05          # [m] leaf up to the split range
    lidar_voxel_far: 0.03           # [m] leaf beyond it
    lidar_voxel_split_range: 6.0   # [m] distance from the sensor separating the two bands

    # -----------------------------------------------------------------------
    # LiDAR — global-frame floor/roof filtering. Neither value is fit here
    # anymore (see preprocessing_node.cpp's file header) — floor_plane_global_
    # arrives asynchronously from static_structures_node (onWallMarkers()).
    # ground_height only bootstraps it flat until the first real (possibly
    # tilted) fit lands; ground_roof_offset sets the roof margin above
    # whatever the CURRENT floor fit is, measured perpendicular to the
    # (possibly tilted) plane, not to world Z.
    # -----------------------------------------------------------------------
    ground_height: -0.3             # [m] bootstrap floor Z in global_frame, before static_structures_node's first fit arrives
    ground_roof_offset: 3.0         # [m] roof = floor_plane_global_ + this

    # -----------------------------------------------------------------------
    # LiDAR — final downsample (after transform + crop)
    # -----------------------------------------------------------------------
    voxel_resolution: 0.10          # [m] voxel leaf size — ALSO what pub_lidar_voxelized_/pub_depth_voxelized publish at, since static_structures_node reuses this exact grid (see the file header)

    # Wall-detection input (lidar/voxelized_sensor -> static_structures_node): floor/ceiling points are cut (margin
    # above the local ground / below the roof) and the voxel is range-dependent — coarse near, fine far — so a far
    # wall is not outvoted by near ones. One more size than band edges; empty sizes = plain voxel_resolution.
    wall_input_height_margin: 0.3       # [m] 0 = no height crop
    wall_input_voxel_sizes: [0.30, 0.20, 0.10]   # [m] leaf per range band (sensor-frame range)
    wall_input_band_edges: [3.0, 6.0]                # [m] band boundaries

    # pub_lidar_processed_'s own voxel step (separate from voxel_resolution
    # above, which stays static_structures_node/calibration_icp_node's shared
    # stage) — same values onboard_detector's dynamicDetector used
    # (voxel starts at 0.1 m, downsample_threshold=7000 points), identical
    # indoor/outdoor there too. See preprocessing_node.cpp's own comment on
    # lidar_processed_voxel_size_ for the adaptive-growth mechanism.
    lidar_processed_voxel_size: 0.1   # [m] starting voxel leaf size for the general-purpose/detection LiDAR cloud
    downsample_threshold: 30000        # points — leaf size only grows (by 10%, re-filtering) while still above this

    wall_removal_margin: 0.10       # [m] points within this distance of a static_structures_node-reported wall/floor plane are dropped
